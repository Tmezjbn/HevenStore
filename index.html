<!DOCTYPE html>
<html lang="ar" dir="ltr" data-theme="heven">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- CoolLabs = Google Fonts API proxy (css @ api…, files @ cdn…) -->
    <link rel="preconnect" href="https://api.fonts.coollabs.io" crossorigin />
    <link rel="preconnect" href="https://cdn.fonts.coollabs.io" crossorigin />
    <!-- Vault (default skin) — the only render-blocking font CSS. -->
    <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Bebas+Neue&display=swap" />
    <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" />
    <!-- Other skins: print media until font-deferred.js flips to all (CSP-safe; no inline onload). -->
    <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Space+Grotesk:wght@400..700&display=swap" media="print" data-onload-media="all" />
    <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap" media="print" data-onload-media="all" />
    <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Syne:wght@400..800&display=swap" media="print" data-onload-media="all" />
    <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Manrope:wght@400..800&display=swap" media="print" data-onload-media="all" />
    <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Literata:opsz,wght@7..72,400..700&display=swap" media="print" data-onload-media="all" />
    <script src="/font-deferred.js" defer></script>
    <noscript>
      <link rel="stylesheet" href="https://api.fonts.coollabs.io/css2?family=Space+Grotesk:wght@400..700&family=Fraunces:opsz,wght@9..144,400..700&family=Syne:wght@400..800&family=Manrope:wght@400..800&family=Literata:opsz,wght@7..72,400..700&display=swap" />
    </noscript>
    <title>HEVEN.FUN — FUN MORE. PAY LESS.</title>
    <meta name="description" content="HEVEN.FUN - وجهتك الأولى للألعاب الرقمية والاشتراكات المميزة بأفضل الأسعار. Games, subscriptions, and digital keys — more fun, less spend." />
    <meta name="keywords" content="games, subscriptions, gift cards, xbox, playstation, ea play, digital games, HEVEN" />
    <link rel="canonical" href="https://heven.fun/" />
    <meta property="og:title" content="HEVEN.FUN — FUN MORE. PAY LESS." />
    <meta property="og:description" content="Games, subscriptions, and digital keys — more fun, less spend." />
    <meta property="og:image" content="https://heven.fun/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://heven.fun/" />
    <meta property="og:site_name" content="HEVEN.FUN" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HEVEN.FUN — FUN MORE. PAY LESS." />
    <meta name="twitter:description" content="Games, subscriptions, and digital keys — more fun, less spend." />
    <meta name="twitter:image" content="https://heven.fun/og-image.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://heven.fun/#organization",
          "name": "HEVEN.FUN",
          "url": "https://heven.fun/",
          "logo": "https://heven.fun/favicon.svg",
          "description": "Games, subscriptions, and digital keys — more fun, less spend."
        },
        {
          "@type": "WebSite",
          "@id": "https://heven.fun/#website",
          "url": "https://heven.fun/",
          "name": "HEVEN.FUN",
          "publisher": { "@id": "https://heven.fun/#organization" },
          "inLanguage": ["ar", "en"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://heven.fun/store?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <!-- Pre-React boot splash (replaced when #root mounts). Hardcoded Vault void. -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#161616;color:#ececec;font-family:Rubik,system-ui,sans-serif}
      #boot-splash .boot-splash__inner{width:min(18rem,86vw);display:flex;flex-direction:column;align-items:center;gap:1.35rem;text-align:center}
      #boot-splash .boot-splash__brand{margin:0;font-family:"Bebas Neue",Rubik,system-ui,sans-serif;font-size:clamp(2.25rem,8vw,3rem);font-weight:900;letter-spacing:-0.03em;line-height:1}
      #boot-splash .boot-splash__track{width:100%;height:0.2rem;border-radius:999px;overflow:hidden;background:rgba(236,236,236,.12)}
      #boot-splash .boot-splash__bar{height:100%;width:38%;border-radius:inherit;background:#ececec;animation:boot-bar 1.05s cubic-bezier(.16,1,.3,1) infinite}
      @keyframes boot-bar{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
      @media (prefers-reduced-motion:reduce){#boot-splash .boot-splash__bar{animation:none;width:42%;margin-inline:auto}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-busy="true" aria-live="polite">
        <div class="boot-splash__inner">
          <p class="boot-splash__brand">HEVEN.FUN</p>
          <div class="boot-splash__track" aria-hidden="true"><div class="boot-splash__bar"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
